[project]
name = "orbstack-machine-nixos-flakes"
version = "0.1.0"
description = "OrbStack NixOS machine provisioning with Nix flakes"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "mypy>=1.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-timeout>=2.1.0",
    "pytest-xdist>=3.0.0",
    "pytest-cov>=4.0.0",
    "pytest-sugar>=0.9.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Include the main script as a py_modules entry
only-include = ["orbstack-machine-nixos-flakes.py"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py313"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
